<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 资讯雷达 | 实时热点与精选情报</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#6366f1',
          }
        }
      }
    }
  </script>
  <style>
    /* 自定义滚动条 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

  <!-- 顶部导航栏 -->
  <header class="sticky top-0 z-50 backdrop-blur-md bg-slate-900/80 border-b border-slate-800 px-6 py-3.5 flex items-center justify-between shadow-sm">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-xl shadow-lg shadow-indigo-500/20">
        🤖
      </div>
      <div>
        <h1 class="text-lg font-bold bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">
          AI 资讯雷达 (AI Radar)
        </h1>
        <p class="text-xs text-slate-400">零成本全自动聚合 · Gemini 智能提炼看点</p>
      </div>
    </div>

    <!-- 状态指示器与刷新倒计时 -->
    <div class="flex items-center space-x-4">
      <div class="flex items-center space-x-2 text-xs bg-slate-800/90 px-3 py-1.5 rounded-full border border-slate-700/60">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-slate-300" id="refresh-indicator">自动同步中 (<span id="timer">30</span>s)</span>
      </div>
      <button onclick="loadNews(true)" class="text-xs bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition text-white px-3 py-1.5 rounded-lg flex items-center space-x-1 shadow-md shadow-indigo-600/20">
        <span>🔄 手动刷新</span>
      </button>
    </div>
  </header>

  <!-- 主体四分栏画廊 -->
  <main class="flex-1 p-6 overflow-x-auto">
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-5 min-w-[1200px] h-[calc(100vh-100px)]">
      
      <!-- 栏目 1: 突发·行业快讯 -->
      <section class="flex flex-col bg-slate-900/60 rounded-2xl border border-slate-800/80 overflow-hidden shadow-xl">
        <div class="px-4 py-3 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between sticky top-0">
          <div class="flex items-center space-x-2">
            <span class="text-amber-400 font-bold">⚡</span>
            <h2 class="font-semibold text-sm text-slate-200">突发·行业快讯</h2>
          </div>
          <span class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 font-mono" id="count-news">0</span>
        </div>
        <div class="flex-1 p-3.5 space-y-3.5 overflow-y-auto" id="col-news">
          <div class="text-xs text-slate-500 text-center py-10 animate-pulse">正在加载资讯...</div>
        </div>
      </section>

      <!-- 栏目 2: 名人·大V热点 -->
      <section class="flex flex-col bg-slate-900/60 rounded-2xl border border-slate-800/80 overflow-hidden shadow-xl">
        <div class="px-4 py-3 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between sticky top-0">
          <div class="flex items-center space-x-2">
            <span class="text-sky-400 font-bold">🐦</span>
            <h2 class="font-semibold text-sm text-slate-200">名人·大V观点</h2>
          </div>
          <span class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 font-mono" id="count-celebrity">0</span>
        </div>
        <div class="flex-1 p-3.5 space-y-3.5 overflow-y-auto" id="col-celebrity">
          <div class="text-xs text-slate-500 text-center py-10 animate-pulse">正在加载资讯...</div>
        </div>
      </section>

      <!-- 栏目 3: 爆款·新AI工具 -->
      <section class="flex flex-col bg-slate-900/60 rounded-2xl border border-slate-800/80 overflow-hidden shadow-xl">
        <div class="px-4 py-3 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between sticky top-0">
          <div class="flex items-center space-x-2">
            <span class="text-emerald-400 font-bold">🛠️</span>
            <h2 class="font-semibold text-sm text-slate-200">爆款·新AI工具</h2>
          </div>
          <span class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 font-mono" id="count-tools">0</span>
        </div>
        <div class="flex-1 p-3.5 space-y-3.5 overflow-y-auto" id="col-tools">
          <div class="text-xs text-slate-500 text-center py-10 animate-pulse">正在加载资讯...</div>
        </div>
      </section>

      <!-- 栏目 4: 实操·精选视频 -->
      <section class="flex flex-col bg-slate-900/60 rounded-2xl border border-slate-800/80 overflow-hidden shadow-xl">
        <div class="px-4 py-3 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between sticky top-0">
          <div class="flex items-center space-x-2">
            <span class="text-purple-400 font-bold">💡</span>
            <h2 class="font-semibold text-sm text-slate-200">实操·精选视频</h2>
          </div>
          <span class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 font-mono" id="count-insights">0</span>
        </div>
        <div class="flex-1 p-3.5 space-y-3.5 overflow-y-auto" id="col-insights">
          <div class="text-xs text-slate-500 text-center py-10 animate-pulse">正在加载资讯...</div>
        </div>
      </section>

    </div>
  </main>

  <script>
    const COLUMNS = ['news', 'celebrity', 'tools', 'insights'];
    let countdown = 30;

    function renderCard(item) {
      const sourceColors = {
        'Hacker News': 'bg-orange-500/10 text-orange-400 border-orange-500/20',
        'Reddit LocalLLaMA': 'bg-red-500/10 text-red-400 border-red-500/20',
        'Reddit Singularity': 'bg-pink-500/10 text-pink-400 border-pink-500/20',
        'Hugging Face': 'bg-yellow-500/10 text-yellow-300 border-yellow-500/20',
        'GitHub': 'bg-slate-700/50 text-slate-300 border-slate-600/30',
        'YouTube': 'bg-rose-500/10 text-rose-400 border-rose-500/20'
      };

      const sourceClass = sourceColors[item.source] || 'bg-slate-800 text-slate-400 border-slate-700';

      const metricsHtml = item.metrics && Object.keys(item.metrics).length > 0 
        ? Object.entries(item.metrics).map(([k, v]) => `<span class="text-[11px] text-slate-400 font-mono">${k}: ${v}</span>`).join('<span class="text-slate-600">·</span>')
        : `<span class="text-[11px] text-slate-500">${item.author || 'AI Radar'}</span>`;

      return `
        <article class="group bg-slate-900/80 hover:bg-slate-800/90 border border-slate-800 hover:border-slate-700 rounded-xl p-4 transition duration-200 flex flex-col space-y-2.5 shadow-sm hover:shadow-md">
          <div class="flex items-center justify-between space-x-2">
            <span class="text-[11px] px-2 py-0.5 rounded-md border font-medium ${sourceClass}">
              ${item.source}
            </span>
            <div class="flex items-center space-x-1.5">
              ${metricsHtml}
            </div>
          </div>

          <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="font-medium text-sm text-slate-200 group-hover:text-indigo-300 transition line-clamp-2 leading-snug">
            ${item.title_zh || item.title}
          </a>

          ${item.summary_zh ? `
            <div class="bg-indigo-950/40 border-l-2 border-indigo-500 px-2.5 py-1.5 rounded-r text-xs text-indigo-200/90 leading-relaxed">
              💡 <span class="font-medium">看点：</span>${item.summary_zh}
            </div>
          ` : ''}

          <div class="pt-1 flex items-center justify-between text-[11px] text-slate-400">
            <div class="flex flex-wrap gap-1">
              ${(item.tags || []).slice(0, 2).map(t => `<span class="bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded text-[10px]">${t}</span>`).join('')}
            </div>
            <a href="${item.url}" target="_blank" class="text-indigo-400 hover:underline flex items-center space-x-0.5">
              <span>直达</span>
              <svg class="w-3 h-3 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
            </a>
          </div>
        </article>
      `;
    }

    async function loadNews(isManual = false) {
      const indicator = document.getElementById('refresh-indicator');
      if (isManual) indicator.innerHTML = `<span class="text-amber-300 animate-spin mr-1">↻</span> 正在拉取最新数据...`;

      try {
        const res = await fetch(`data/latest_news.json?t=${Date.now()}`);
        if (!res.ok) throw new Error("尚未生成数据文件");
        const data = await res.json();
        
        COLUMNS.forEach(col => {
          const list = (data.grouped && data.grouped[col]) || [];
          document.getElementById(`count-${col}`).textContent = list.length;
          const container = document.getElementById(`col-${col}`);
          if (list.length === 0) {
            container.innerHTML = `<div class="text-xs text-slate-500 text-center py-10">暂无此分类资讯</div>`;
          } else {
            container.innerHTML = list.map(item => renderCard(item)).join('');
          }
        });

        countdown = 30;
      } catch (err) {
        console.warn(err);
      }
    }

    // 倒计时刷新器
    setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        loadNews();
        countdown = 30;
      }
      const timerEl = document.getElementById('timer');
      if (timerEl) timerEl.textContent = countdown;
    }, 1000);

    // 初始加载
    loadNews();
  </script>
</body>
</html>
