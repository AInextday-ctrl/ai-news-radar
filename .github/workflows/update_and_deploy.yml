name: AI Radar - 24x7 Auto Update & Deploy

on:
  schedule:
    # 每 15 分钟在云端高频增量抓取更新一次 (UTC)
    - cron: '*/15 * * * *'
  workflow_dispatch: # 支持在 GitHub 网页上一键手动立即触发
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  auto-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Fetcher & AI Summarizer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-2.5-flash'
          PYTHONIOENCODING: 'utf-8'
        run: |
          python main.py

      - name: Commit Updated News Data to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自动同步最新 AI 资讯 [skip ci]" && git push) || echo "⚠️ Git push skipped"

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "❌ 错误: 未检测到 FIREBASE_TOKEN！请在 GitHub 仓库 Settings -> Secrets 中添加 FIREBASE_TOKEN。"
            exit 1
          fi
          npx -y firebase-tools@latest deploy --only hosting --token "$FIREBASE_TOKEN" --non-interactive
