name: AI Radar - 24x7 Auto Update & Deploy

on:
  schedule:
    # 每 8 分钟在云端极速增量抓取更新一次 (UTC，每天 180+ 次全天候极速监控)
    # 采用错峰偏移间隔 (每 20 分钟)，避开整点/整半点拥堵高峰与并发锁冲突
    - cron: '6,26,46 * * * *'
  workflow_dispatch: # 支持在 GitHub 网页上一键手动立即触发
  repository_dispatch: # 支持云端外部 Webhook (cron-job.org / Cloudflare) 秒级即时触发
    types: [auto-sync, cron-trigger]
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ai-radar-sync
  cancel-in-progress: false

jobs:
  auto-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Fetcher & AI Summarizer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_TOPICS: ${{ secrets.GEMINI_API_KEY_TOPICS }}
          GEMINI_API_KEY_NEWS: ${{ secrets.GEMINI_API_KEY_NEWS }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_MODEL: 'gemini-flash-latest'
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_INTERVAL_HOURS: '0.2'
          PYTHONIOENCODING: 'utf-8'
        run: |
          python main.py || (echo "⚠️ main.py 遇到偶发异常，触发缓存自愈静态发布..." && python content_publisher.py)

      - name: Localize Tool Preview Images
        run: |
          python scripts/localize_tool_images.py || echo "⚠️ 工具预览图本地化异常，已安全自愈放行"

      - name: Enforce Multilingual Quality & Consistency Gate
        run: |
          python language_sentinel.py

      - name: Dual Edition Static Prerender & SEO Publisher
        run: |
          python content_publisher.py

      - name: Hard CI Data Quality & Strict Language Gate Audit
        run: |
          python tests/test_data_quality_gate.py

      - name: Commit Updated News Data to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "🤖 自动同步最新 AI 资讯与静态 SEO 索引 [skip ci]"
            if ! git pull --rebase origin main; then
              echo "⚠️ 检测到远程仓库在此次运行期间已被更新的提交修改，主动让步放弃此次合并，下一个 8 分钟自动化周期将拉取最新基线。"
              git rebase --abort
              exit 0
            fi
            git push || (echo "⚠️ Git push 遇并发提交占用，主动让步由后续周期同步。" && exit 0)
          fi

      - name: Verify Quality Gate Before Hosting Deployment
        run: |
          python tests/test_data_quality_gate.py

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "⚠️ [Notice] FIREBASE_TOKEN secret is not set in GitHub repository Settings -> Secrets."
            echo "💡 Data updates are successfully committed to the repo. To enable auto-deployment to Firebase Hosting from GitHub Actions, add FIREBASE_TOKEN in Settings -> Secrets -> Actions."
          else
            echo "🚀 Deploying to Firebase Hosting with FIREBASE_TOKEN..."
            npx -y firebase-tools deploy --only hosting --non-interactive || (echo "⚠️ 首次部署出现网络抖动，5秒后自动重试..." && sleep 5 && npx -y firebase-tools deploy --only hosting --non-interactive)
          fi
