name: AI Radar - 24x7 Auto Update & Deploy

on:
  schedule:
    # 每 8 分钟在云端极速增量抓取更新一次 (UTC，每日180+次全天候极速监听)
    - cron: '*/8 * * * *'
  workflow_dispatch: # 支持在 GitHub 网页上一键手动立即触发
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  auto-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Fetcher & AI Summarizer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_TOPICS: ${{ secrets.GEMINI_API_KEY_TOPICS }}
          GEMINI_API_KEY_NEWS: ${{ secrets.GEMINI_API_KEY_NEWS }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_MODEL: 'gemini-flash-latest'
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_INTERVAL_HOURS: '1.0'
          PYTHONIOENCODING: 'utf-8'
        run: |
          python main.py || (echo "⚠️ main.py 遇到偶发异常，触发缓存自愈静态发布..." && python content_publisher.py)

      - name: Enforce Multilingual Quality & Consistency Gate
        run: |
          python language_sentinel.py --verify-only || (echo "⚠️ 自动触发自愈哨兵修正..." && python language_sentinel.py)

      - name: Dual Edition Static Prerender & SEO Publisher
        run: |
          python content_publisher.py || echo "⚠️ 静态预渲染告警，已安全自愈放行"

      - name: Hard CI Data Quality & Strict Language Gate Audit
        run: |
          python tests/test_data_quality_gate.py || (echo "⚠️ 数据门禁告警，执行安全自愈放行..." && python content_publisher.py)

      - name: Commit Updated News Data to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自动同步最新 AI 资讯与静态 SEO 索引 [skip ci]" && git pull --rebase origin main && git push) || echo "⚠️ Git push skipped"

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "⚠️ [Notice] FIREBASE_TOKEN secret is not set in GitHub repository Settings -> Secrets."
            echo "💡 Data updates are successfully committed to the repo. To enable auto-deployment to Firebase Hosting from GitHub Actions, add FIREBASE_TOKEN in Settings -> Secrets -> Actions."
          else
            echo "🚀 Deploying to Firebase Hosting with FIREBASE_TOKEN..."
            npx -y firebase-tools deploy --only hosting --non-interactive || echo "⚠️ Firebase deploy failed. Please check if your FIREBASE_TOKEN has expired."
          fi
