<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 资讯雷达 2.0 | 全景多媒体 AI 情报与落地神器站</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#6366f1',
          }
        }
      }
    }
  </script>
  <style>
    /* 自定义极客深色滚动条 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #060913; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
    
    .glass-panel {
      background: rgba(13, 19, 34, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(17, 24, 43, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .glass-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 12px 30px -10px rgba(99, 102, 241, 0.15);
    }
  </style>
</head>
<body class="bg-[#050811] text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white antialiased">

  <!-- 顶部科技导航栏 -->
  <header class="sticky top-0 z-40 backdrop-blur-2xl bg-[#070b16]/90 border-b border-slate-800/80 px-6 py-3 flex items-center justify-between shadow-2xl">
    <div class="flex items-center space-x-3.5">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center text-xl shadow-lg shadow-indigo-500/25 ring-1 ring-white/20">
        🤖
      </div>
      <div>
        <div class="flex items-center space-x-2">
          <h1 class="text-lg font-black tracking-tight bg-gradient-to-r from-white via-slate-100 to-indigo-300 bg-clip-text text-transparent">
            AI 资讯雷达
          </h1>
          <span class="text-[10px] uppercase font-extrabold px-2 py-0.5 rounded-md bg-gradient-to-r from-indigo-500/20 to-purple-500/20 text-indigo-400 border border-indigo-500/30 tracking-wider">
            RADAR 2.0
          </span>
        </div>
        <p class="text-xs text-slate-400 font-medium" id="header-subtitle">
          全网热点 · 领袖推特 · 视频实战 · 场景工具 · 提示词库
        </p>
      </div>
    </div>

    <!-- 右上角：中英文切换、状态指示灯与刷新 -->
    <div class="flex items-center space-x-3">
      
      <!-- 🌐 中英文切换胶囊 -->
      <div class="flex items-center bg-slate-900/90 p-1 rounded-xl border border-slate-700/60 shadow-inner">
        <button id="lang-zh" onclick="setLanguage('zh')" class="px-2.5 py-1 text-xs font-semibold rounded-lg transition-all duration-200 bg-indigo-600 text-white shadow-sm">
          🇨🇳 中文
        </button>
        <button id="lang-en" onclick="setLanguage('en')" class="px-2.5 py-1 text-xs font-semibold rounded-lg transition-all duration-200 text-slate-400 hover:text-white">
          🇬🇧 EN
        </button>
      </div>

      <!-- 实时同步灯 -->
      <div class="hidden sm:flex items-center space-x-2 text-xs bg-slate-900/80 px-3 py-1.5 rounded-xl border border-slate-800">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
        </span>
        <span class="text-slate-300 font-mono text-[11px]" id="refresh-indicator">自动刷新 (<span id="timer">30</span>s)</span>
      </div>

      <!-- 手动刷新按钮 -->
      <button onclick="loadNews(true)" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 active:scale-95 transition-all px-3 py-1.5 rounded-xl flex items-center space-x-1.5 shadow-sm">
        <span>🔄</span>
        <span id="refresh-btn-text" class="font-medium">刷新</span>
      </button>
    </div>
  </header>

  <!-- 🔥 今日 60 秒极速通 (Top 3 深度风向标横幅) -->
  <section class="px-6 pt-4 pb-2">
    <div class="bg-gradient-to-r from-indigo-950/40 via-purple-950/20 to-slate-900/50 rounded-2xl border border-indigo-500/20 p-3.5 shadow-xl">
      <div class="flex items-center space-x-2 mb-2.5">
        <span class="text-sm font-bold bg-gradient-to-r from-amber-400 to-orange-400 bg-clip-text text-transparent flex items-center space-x-1">
          <span>🔥</span>
          <span id="digest-title">今日 AI 风向标 (60秒必读 Top 3)</span>
        </span>
        <span class="text-[10px] text-slate-400">· 帮你在最短时间内抓住今日行业命脉</span>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3" id="top-three-container">
        <!-- 由 JS 动态注入 Top 3 -->
        <div class="bg-slate-900/60 rounded-xl p-2.5 border border-slate-800 text-xs text-slate-400 animate-pulse">正在提炼今日风向标...</div>
      </div>
    </div>
  </section>

  <!-- 主体四分栏画廊 -->
  <main class="flex-1 px-6 py-4 overflow-x-auto">
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-5 min-w-[1320px] h-[calc(100vh-190px)]">
      
      <!-- 栏目 1: ⚡ 突发·行业快讯 -->
      <section class="flex flex-col glass-panel rounded-2xl overflow-hidden shadow-2xl">
        <div class="px-4 py-3 bg-[#0c1220]/95 border-b border-slate-800/90 flex items-center justify-between sticky top-0 z-10">
          <div class="flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-400 shadow-sm shadow-amber-400/50"></span>
            <h2 class="font-bold text-sm tracking-wide text-slate-100" id="col-title-news">⚡ 突发·行业快讯</h2>
          </div>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-amber-500/10 text-amber-300 border border-amber-500/20 font-mono font-semibold" id="count-news">0</span>
        </div>
        <div class="flex-1 p-3.5 space-y-3.5 overflow-y-auto" id="col-news">
          <div class="text-xs text-slate-500 text-center py-20 animate-pulse">正在侦测全球突发动态...</div>
        </div>
      </section>

      <!-- 栏目 2: 🐦 领袖观点·社交热议 -->
      <section class="flex flex-col glass-panel rounded-2xl overflow-hidden shadow-2xl">
        <div class="px-4 py-3 bg-[#0c1220]/95 border-b border-slate-800/90 flex items-center justify-between sticky top-0 z-10">
          <div class="flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-sky-400 shadow-sm shadow-sky-400/50"></span>
            <h2 class="font-bold text-sm tracking-wide text-slate-100" id="col-title-celebrity">🐦 领袖观点·社交热议</h2>
          </div>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-sky-500/10 text-sky-300 border border-sky-500/20 font-mono font-semibold" id="count-celebrity">0</span>
        </div>
        <div class="flex-1 p-3.5 space-y-3.5 overflow-y-auto" id="col-celebrity">
          <div class="text-xs text-slate-500 text-center py-20 animate-pulse">正在捕捉推特领袖交锋...</div>
        </div>
      </section>

      <!-- 栏目 3: 🛠️ 场景落地·实用神器 -->
      <section class="flex flex-col glass-panel rounded-2xl overflow-hidden shadow-2xl">
        <div class="px-4 py-3 bg-[#0c1220]/95 border-b border-slate-800/90 flex items-center justify-between sticky top-0 z-10">
          <div class="flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-sm shadow-emerald-400/50"></span>
            <h2 class="font-bold text-sm tracking-wide text-slate-100" id="col-title-tools">🛠️ 场景落地·实用神器</h2>
          </div>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-300 border border-emerald-500/20 font-mono font-semibold" id="count-tools">0</span>
        </div>
        <div class="flex-1 p-3.5 space-y-3.5 overflow-y-auto" id="col-tools">
          <div class="text-xs text-slate-500 text-center py-20 animate-pulse">正在筛选面向用户的开箱即用工具...</div>
        </div>
      </section>

      <!-- 栏目 4: 🎬 爆款演示·实操技巧 -->
      <section class="flex flex-col glass-panel rounded-2xl overflow-hidden shadow-2xl">
        <div class="px-4 py-3 bg-[#0c1220]/95 border-b border-slate-800/90 flex items-center justify-between sticky top-0 z-10">
          <div class="flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-rose-500 shadow-sm shadow-rose-500/50"></span>
            <h2 class="font-bold text-sm tracking-wide text-slate-100" id="col-title-videos">🎬 爆款演示·实操技巧</h2>
          </div>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-rose-500/10 text-rose-300 border border-rose-500/20 font-mono font-semibold" id="count-videos">0</span>
        </div>
        <div class="flex-1 p-3.5 space-y-3.5 overflow-y-auto" id="col-videos">
          <div class="text-xs text-slate-500 text-center py-20 animate-pulse">正在拉取 YouTube 实操视频与爆款 Prompt...</div>
        </div>
      </section>

    </div>
  </main>

  <!-- 视频播放弹窗 Modal (点击视频卡片在站内直接播放) -->
  <div id="video-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl overflow-hidden max-w-3xl w-full shadow-2xl relative">
      <div class="p-3 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
        <span class="text-xs font-semibold text-slate-300" id="modal-video-title">YouTube 视频播放器</span>
        <button onclick="closeVideoModal()" class="text-slate-400 hover:text-white text-lg font-bold px-2 py-1">✕</button>
      </div>
      <div class="relative w-full aspect-video bg-black">
        <iframe id="video-iframe" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <!-- 复制成功的轻量 Toast 提示 -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 bg-indigo-600 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 flex items-center space-x-2">
    <span>✅</span>
    <span id="toast-text">提示词已成功复制到剪贴板！</span>
  </div>

  <script>
    const COLUMNS = ['news', 'celebrity', 'tools', 'videos'];
    let currentLang = localStorage.getItem('ai_radar_lang') || 'zh';
    let cachedData = null;
    let countdown = 30;

    const I18N = {
      zh: {
        subtitle: "全网突发 · 领袖观点 · 落地神器 · 视频实操 · 提示词神咒",
        refreshBtn: "刷新",
        digestTitle: "今日 AI 风向标 (60秒极速通 Top 3)",
        takeaway: "核心看点",
        readOriginal: "直达报道",
        tryTool: "体验神器",
        viewPost: "查看原帖/推文",
        playVideo: "视频精讲",
        copyPrompt: "📋 一键复制提示词",
        justNow: "刚刚",
        newsReport: "快讯简报",
        colTitles: {
          news: "⚡ 突发·行业快讯",
          celebrity: "🐦 领袖观点·社交热议",
          tools: "🛠️ 场景落地·实用神器",
          videos: "🎬 爆款演示·实操技巧"
        }
      },
      en: {
        subtitle: "Breaking News · Top Voices · Scenario Tools · Video Demos · Prompts",
        refreshBtn: "Refresh",
        digestTitle: "Today's AI Digest (Top 3 in 60s)",
        takeaway: "Key Insight",
        readOriginal: "Read Story",
        tryTool: "Try Tool",
        viewPost: "View Post",
        playVideo: "Video Demo",
        copyPrompt: "📋 Copy Prompt",
        justNow: "Just now",
        newsReport: "Flash News",
        colTitles: {
          news: "⚡ Breaking News",
          celebrity: "🐦 Leaders & Voices",
          tools: "🛠️ Applied AI Tools",
          videos: "🎬 Videos & Prompts"
        }
      }
    };

    // 高精度时间格式化工具：精确时间 + 相对时间 + 是否今日
    function formatTime(rawTime, lang = 'zh') {
      if (!rawTime) return { display: (lang === 'zh' ? '刚刚更新' : 'Just now'), isToday: true };
      try {
        const date = new Date(rawTime);
        if (isNaN(date.getTime())) return { display: rawTime, isToday: false };

        const now = new Date();
        const diffSec = Math.max(0, Math.floor((now - date) / 1000));
        const isToday = diffSec < 86400;

        const Y = date.getFullYear();
        const M = String(date.getMonth() + 1).padStart(2, '0');
        const D = String(date.getDate()).padStart(2, '0');
        const h = String(date.getHours()).padStart(2, '0');
        const m = String(date.getMinutes()).padStart(2, '0');
        const exactTime = `${Y}-${M}-${D} ${h}:${m}`;

        let relative = '';
        if (diffSec < 60) {
          relative = lang === 'zh' ? '刚刚' : 'Just now';
        } else if (diffSec < 3600) {
          const mins = Math.floor(diffSec / 60);
          relative = lang === 'zh' ? `${mins}分钟前` : `${mins}m ago`;
        } else if (diffSec < 86400) {
          const hours = Math.floor(diffSec / 3600);
          relative = lang === 'zh' ? `${hours}小时前` : `${hours}h ago`;
        } else if (diffSec < 86400 * 2) {
          relative = lang === 'zh' ? `昨天 ${h}:${m}` : `Yesterday ${h}:${m}`;
        } else {
          const days = Math.floor(diffSec / 86400);
          relative = lang === 'zh' ? `${days}天前` : `${days}d ago`;
        }

        return { display: `${exactTime} · ${relative}`, isToday };
      } catch (e) {
        return { display: rawTime || '', isToday: false };
      }
    }

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('ai_radar_lang', lang);

      const btnZh = document.getElementById('lang-zh');
      const btnEn = document.getElementById('lang-en');
      if (lang === 'zh') {
        btnZh.className = "px-2.5 py-1 text-xs font-semibold rounded-lg transition-all duration-200 bg-indigo-600 text-white shadow-sm";
        btnEn.className = "px-2.5 py-1 text-xs font-semibold rounded-lg transition-all duration-200 text-slate-400 hover:text-white";
      } else {
        btnEn.className = "px-2.5 py-1 text-xs font-semibold rounded-lg transition-all duration-200 bg-indigo-600 text-white shadow-sm";
        btnZh.className = "px-2.5 py-1 text-xs font-semibold rounded-lg transition-all duration-200 text-slate-400 hover:text-white";
      }

      const t = I18N[lang];
      document.getElementById('header-subtitle').textContent = t.subtitle;
      document.getElementById('refresh-btn-text').textContent = t.refreshBtn;
      document.getElementById('digest-title').textContent = t.digestTitle;

      COLUMNS.forEach(col => {
        document.getElementById(`col-title-${col}`).textContent = t.colTitles[col];
      });

      if (cachedData) {
        renderTopThree(cachedData.top_three || []);
        renderAllColumns(cachedData);
      }
    }

    // 渲染今日 60s Top 3 走马灯 (双语纯净切换 + 具体时间戳)
    function renderTopThree(topItems) {
      const container = document.getElementById('top-three-container');
      if (!topItems || topItems.length === 0) {
        container.innerHTML = `<div class="text-xs text-slate-400 col-span-3">今日要闻正在生成中...</div>`;
        return;
      }

      const isZh = currentLang === 'zh';
      container.innerHTML = topItems.map(item => {
        const badge = isZh ? (item.badge_zh || item.badge) : (item.badge_en || item.badge);
        const title = isZh ? (item.title_zh || item.title) : (item.title_en || item.title);
        const summary = isZh ? (item.summary_zh || item.summary) : (item.summary_en || item.summary);
        const timeObj = formatTime(item.raw_published_at, currentLang);
        const todayBadge = timeObj.isToday ? `<span class="px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-[9px] font-bold">🔥 ${isZh ? '今日' : 'TODAY'}</span>` : '';

        return `
          <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="group bg-slate-900/80 hover:bg-slate-800 border border-slate-800 hover:border-indigo-500/40 p-3 rounded-xl transition-all flex flex-col space-y-1.5 shadow-sm">
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-1.5">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20">${badge}</span>
                ${todayBadge}
              </div>
              <span class="text-[10px] text-slate-400 font-mono">🕒 ${timeObj.display}</span>
            </div>
            <h3 class="font-semibold text-xs text-slate-100 group-hover:text-indigo-300 transition-colors line-clamp-1 leading-snug">
              ${title}
            </h3>
            <p class="text-[11px] text-slate-400 line-clamp-1">
              ${summary}
            </p>
          </a>
        `;
      }).join('');
    }

    // 渲染四分栏不同风格的资讯卡片 (图文并茂 + 精确时间戳)
    function renderCard(item) {
      const t = I18N[currentLang];
      const isZh = currentLang === 'zh';
      const title = (isZh && item.title_zh) ? item.title_zh : item.title;
      const summary = (isZh && item.summary_zh) ? item.summary_zh : (item.content_snippet || "");
      const timeObj = formatTime(item.raw_published_at, currentLang);
      const timeStr = timeObj.display;
      const todayBadge = timeObj.isToday ? `<span class="px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-[9px] font-bold">🔥 ${isZh ? '今日首发' : 'TODAY'}</span>` : '';

      // ===================================
      // 样式 A: 🎬 视频与实战 Prompt 卡片
      // ===================================
      if (item.category === 'videos') {
        // 如果是可一键复制的 Prompt
        if (item.is_prompt) {
          return `
            <article class="glass-card rounded-xl p-3.5 transition-all flex flex-col space-y-2.5 border-purple-500/30 shadow-lg">
              <div class="flex items-center justify-between">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-purple-500/15 text-purple-300 border border-purple-500/30">
                  💡 实操神咒
                </span>
                <div class="flex items-center space-x-1.5">
                  ${todayBadge}
                  <span class="text-[10px] text-slate-400 font-mono">🕒 ${timeStr}</span>
                </div>
              </div>
              <h3 class="font-bold text-sm text-slate-100">${title}</h3>
              <div class="bg-slate-950/80 p-2.5 rounded-lg border border-slate-800 text-[11px] text-purple-200 font-mono leading-relaxed select-all">
                ${item.prompt_content}
              </div>
              <button onclick="copyToClipboard('${item.prompt_content.replace(/'/g, "\\'")}')" class="w-full bg-purple-600/20 hover:bg-purple-600/30 border border-purple-500/40 text-purple-200 text-xs font-semibold py-1.5 rounded-lg transition-colors flex items-center justify-center space-x-1">
                <span>${t.copyPrompt}</span>
              </button>
            </article>
          `;
        }

        // 如果是 16:9 YouTube 视频
        return `
          <article class="group glass-card rounded-xl p-3 transition-all flex flex-col space-y-2.5 shadow-md">
            <div class="relative w-full aspect-video rounded-lg overflow-hidden bg-slate-900 border border-slate-800 cursor-pointer" onclick="openVideoModal('${item.embed_url}', '${title.replace(/'/g, "\\'")}')">
              <img src="${item.image_url}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
              <div class="absolute inset-0 bg-black/30 flex items-center justify-center group-hover:bg-black/10 transition-colors">
                <div class="w-11 h-11 rounded-full bg-rose-600/90 text-white flex items-center justify-center text-lg pl-0.5 shadow-xl group-hover:scale-110 transition-transform">
                  ▶
                </div>
              </div>
              <span class="absolute bottom-2 right-2 bg-black/80 px-1.5 py-0.5 rounded text-[10px] font-mono text-white">${t.playVideo}</span>
            </div>

            <div class="flex items-center justify-between text-[11px]">
              <span class="text-rose-400 font-medium">${item.source}</span>
              <div class="flex items-center space-x-1.5">
                ${todayBadge}
                <span class="text-slate-400 font-mono text-[10px]">🕒 ${timeStr}</span>
              </div>
            </div>

            <h3 class="font-semibold text-sm text-slate-100 group-hover:text-indigo-300 transition-colors line-clamp-2 leading-snug cursor-pointer" onclick="openVideoModal('${item.embed_url}', '${title.replace(/'/g, "\\'")}')">
              ${title}
            </h3>

            ${summary ? `
              <div class="bg-slate-900/80 p-2 rounded text-xs text-slate-300 line-clamp-2">
                ${summary}
              </div>
            ` : ''}
          </article>
        `;
      }

      // ===================================
      // 样式 B: 🛠️ 场景化落地工具卡片
      // ===================================
      if (item.category === 'tools') {
        const scenario = item.scenario_tag || "🤖 落地神器";
        const pricing = item.pricing_tag || "🟢 开源免费";

        return `
          <article class="group glass-card rounded-xl p-3.5 transition-all flex flex-col space-y-2.5 shadow-md">
            
            ${item.image_url ? `
              <div class="w-full h-32 rounded-lg overflow-hidden bg-slate-900 border border-slate-800">
                <img src="${item.image_url}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=800&q=80&auto=format&fit=crop'">
              </div>
            ` : ''}

            <div class="flex items-center justify-between space-x-2">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">
                ${scenario}
              </span>
              <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">
                ${pricing}
              </span>
            </div>

            <div class="flex items-center space-x-1.5">
              ${todayBadge}
              <span class="text-[10px] text-slate-400 font-mono">🕒 ${timeStr}</span>
            </div>

            <h3 class="font-bold text-sm text-slate-100 group-hover:text-emerald-300 transition-colors line-clamp-2 leading-snug">
              ${title}
            </h3>

            <p class="text-xs text-slate-400 line-clamp-2 leading-relaxed">
              💡 ${summary}
            </p>

            <div class="pt-1 flex items-center justify-between border-t border-slate-800/80">
              <span class="text-[10px] text-slate-500">${item.source}</span>
              <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="text-xs font-semibold text-emerald-400 hover:text-emerald-300 flex items-center space-x-1">
                <span>${t.tryTool}</span>
                <span>→</span>
              </a>
            </div>
          </article>
        `;
      }

      // ===================================
      // 样式 C: 🐦 名人领袖与社交推文卡片
      // ===================================
      if (item.category === 'celebrity') {
        const avatar = item.author_avatar || "https://unavatar.io/x/sama";
        const handle = item.author_handle || "@sama";

        return `
          <article class="group glass-card rounded-xl p-3.5 transition-all flex flex-col space-y-2.5 shadow-md border-sky-500/20">
            <!-- 领袖身份头部 -->
            <div class="flex items-center space-x-2.5">
              <img src="${avatar}" class="w-8 h-8 rounded-full border border-sky-400/40 object-cover" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=${item.author}'">
              <div class="flex-1 min-w-0">
                <div class="flex items-center space-x-1">
                  <span class="font-bold text-xs text-slate-100 truncate">${item.author}</span>
                  <span class="text-sky-400 text-xs">✓</span>
                </div>
                <span class="text-[10px] text-slate-400 font-mono block truncate">${handle}</span>
              </div>
              <span class="text-[10px] px-2 py-0.5 rounded bg-sky-500/10 text-sky-300 border border-sky-500/20">领袖声音</span>
            </div>

            <div class="flex items-center justify-between text-[10px]">
              <div class="flex items-center space-x-1.5">
                ${todayBadge}
                <span class="text-slate-400 font-mono">🕒 ${timeStr}</span>
              </div>
              <span class="text-sky-400/80 font-medium">${item.source}</span>
            </div>

            <!-- 嵌入推文/社交配图 (如有) -->
            ${(item.image_url && !item.image_url.includes('unavatar') && !item.image_url.includes('dicebear')) ? `
              <div class="w-full h-32 rounded-lg overflow-hidden bg-slate-900 border border-slate-800">
                <img src="${item.image_url}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy" onerror="this.parentElement.style.display='none'">
              </div>
            ` : ''}

            <!-- 核心观点引用 -->
            <blockquote class="bg-sky-950/20 border-l-2 border-sky-400 pl-2.5 py-1 text-xs text-sky-100/95 font-medium leading-relaxed italic">
              “${title}”
            </blockquote>

            <!-- 详细解读 -->
            ${summary ? `
              <p class="text-[11px] text-slate-300 leading-relaxed">
                ${summary}
              </p>
            ` : ''}

            <div class="pt-1 flex items-center justify-between text-[10px] text-slate-400 border-t border-slate-800/80">
              <span>${item.source}</span>
              <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="text-sky-400 hover:underline flex items-center space-x-0.5">
                <span>${t.viewPost}</span>
                <span>↗</span>
              </a>
            </div>
          </article>
        `;
      }

      // ===================================
      // 样式 D: ⚡ 突发大事件快讯卡片 (图文并茂 + 具体时间戳)
      // ===================================
      return `
        <article class="group glass-card rounded-xl p-3.5 transition-all flex flex-col space-y-2.5 shadow-md">
          
          ${item.image_url ? `
            <div class="w-full h-36 rounded-lg overflow-hidden bg-slate-900 border border-slate-800">
              <img src="${item.image_url}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&q=80&auto=format&fit=crop'">
            </div>
          ` : ''}

          <div class="flex items-center justify-between">
            <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-500/15 text-amber-300 border border-amber-500/30 font-mono">
              ${item.source}
            </span>
            <div class="flex items-center space-x-1.5">
              ${todayBadge}
              <span class="text-[10px] text-slate-400 font-mono">🕒 ${timeStr}</span>
            </div>
          </div>

          <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="font-bold text-sm text-slate-100 group-hover:text-indigo-300 transition-colors line-clamp-2 leading-snug">
            ${title}
          </a>

          ${summary ? `
            <div class="bg-amber-950/20 border-l-2 border-amber-400/80 px-2.5 py-1.5 rounded-r text-xs text-amber-100/90 leading-relaxed">
              <span class="font-bold text-amber-300">💡 ${t.takeaway}：</span>${summary}
            </div>
          ` : ''}

          <div class="pt-1 flex items-center justify-between text-[11px] text-slate-400 border-t border-slate-800/80">
            <span class="text-[10px] text-slate-500">${t.newsReport}</span>
            <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="text-indigo-400 hover:underline flex items-center space-x-0.5 font-medium">
              <span>${t.readOriginal}</span>
              <span>↗</span>
            </a>
          </div>
        </article>
      `;
    }

    function renderAllColumns(data) {
      COLUMNS.forEach(col => {
        const list = (data.grouped && data.grouped[col]) || [];
        document.getElementById(`count-${col}`).textContent = list.length;
        const container = document.getElementById(`col-${col}`);
        if (list.length === 0) {
          container.innerHTML = `<div class="text-xs text-slate-500 text-center py-20 font-medium">暂无此分类资讯</div>`;
        } else {
          container.innerHTML = list.map(item => renderCard(item)).join('');
        }
      });
    }

    // 复制 Prompt 到剪贴板并展示 Toast
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.className = "fixed bottom-6 right-6 z-50 bg-indigo-600 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-2xl transform translate-y-0 opacity-100 transition-all duration-300 flex items-center space-x-2";
        setTimeout(() => {
          toast.className = "fixed bottom-6 right-6 z-50 bg-indigo-600 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 flex items-center space-x-2";
        }, 2500);
      });
    }

    // 站内弹窗播放 YouTube 视频
    function openVideoModal(embedUrl, title) {
      if (!embedUrl) return;
      document.getElementById('modal-video-title').textContent = title;
      document.getElementById('video-iframe').src = embedUrl + "?autoplay=1";
      document.getElementById('video-modal').classList.remove('hidden');
    }

    function closeVideoModal() {
      document.getElementById('video-iframe').src = "";
      document.getElementById('video-modal').classList.add('hidden');
    }

    // 数据加载与倒计时
    async function loadNews(isManual = false) {
      const indicator = document.getElementById('refresh-indicator');
      if (isManual) {
        indicator.innerHTML = `<span class="text-amber-300 animate-spin mr-1">↻</span> 正在拉取...`;
      }

      try {
        const res = await fetch(`data/latest_news.json?t=${Date.now()}`);
        if (!res.ok) throw new Error("无法读取数据");
        const data = await res.json();
        cachedData = data;
        renderTopThree(data.top_three || []);
        renderAllColumns(data);
        countdown = 30;
      } catch (err) {
        console.warn("加载新闻数据失败:", err);
      }
    }

    setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        loadNews();
        countdown = 30;
      }
      const timerEl = document.getElementById('timer');
      if (timerEl) timerEl.textContent = countdown;
    }, 1000);

    setLanguage(currentLang);
    loadNews();
  </script>
</body>
</html>
