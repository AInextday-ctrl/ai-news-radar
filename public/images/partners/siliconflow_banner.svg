<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="sf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051329" />
      <stop offset="50%" stop-color="#0a2540" />
      <stop offset="100%" stop-color="#040e1f" />
    </linearGradient>
    <radialGradient id="sf-glow" cx="65%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#051329" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#sf-bg)" rx="20" />
  <rect width="640" height="360" fill="url(#sf-glow)" rx="20" />

  <!-- Grid lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="640" y2="90" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="270" x2="640" y2="270" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
  </g>

  <!-- Neural Chip / Model Cluster Graphic on Right -->
  <g transform="translate(410, 80)">
    <!-- Central AI Core Chip -->
    <rect x="30" y="30" width="130" height="130" rx="16" fill="url(#chip-grad)" stroke="#38bdf8" stroke-width="2" />
    <rect x="45" y="45" width="100" height="100" rx="10" fill="#032b4d" stroke="#0ea5e9" stroke-width="1" />
    
    <!-- Chip Cores -->
    <text x="95" y="88" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#ffffff">SiliconFlow</text>
    <text x="95" y="112" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">LLM INFERENCE</text>

    <!-- Node connection pins -->
    <line x1="95" y1="0" x2="95" y2="30" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
    <circle cx="95" cy="0" r="4" fill="#38bdf8" />
    <line x1="95" y1="160" x2="95" y2="190" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
    <circle cx="95" cy="190" r="4" fill="#38bdf8" />

    <line x1="0" y1="95" x2="30" y2="95" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
    <circle cx="0" cy="95" r="4" fill="#38bdf8" />
    <line x1="160" y1="95" x2="190" y2="95" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
    <circle cx="190" cy="95" r="4" fill="#38bdf8" />

    <!-- Model Supported Badges -->
    <g transform="translate(0, 196)">
      <text x="95" y="16" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#7dd3fc">DeepSeek · Qwen · Llama 3</text>
    </g>
  </g>

  <!-- Left Content -->
  <g transform="translate(48, 56)">
    <!-- Brand -->
    <g transform="translate(0, 0)">
      <circle cx="16" cy="16" r="16" fill="#0284c7" />
      <polygon points="12,8 24,16 12,24" fill="#ffffff" />
      <text x="44" y="25" font-family="Inter, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#ffffff">硅基流动 SiliconFlow</text>
    </g>

    <!-- Pill -->
    <g transform="translate(0, 58)">
      <rect x="0" y="0" width="160" height="26" rx="13" fill="rgba(2,132,199,0.2)" stroke="rgba(56,189,248,0.4)" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#38bdf8" />
      <text x="26" y="17" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#7dd3fc" letter-spacing="0.5">开源大模型 API</text>
    </g>

    <text x="0" y="128" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="-0.3">
      全球主流开源大模型
    </text>
    <text x="0" y="156" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#38bdf8" letter-spacing="-0.3">
      极速高并发推理云
    </text>

    <text x="0" y="194" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
      毫秒级响应、超低调用成本，注册即送免费体验额度
    </text>

    <g transform="translate(0, 222)">
      <text x="0" y="0" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">✦ 兼容 OpenAI 格式 API</text>
      <text x="160" y="0" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">✦ 注册即领 14 元体验金</text>
    </g>
  </g>

  <!-- Top Right Badge -->
  <g transform="translate(488, 28)">
    <rect x="0" y="0" width="124" height="24" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="1" />
    <text x="62" y="16" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">生态合作推荐</text>
  </g>

  <rect x="1" y="1" width="638" height="358" rx="19" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
</svg>
