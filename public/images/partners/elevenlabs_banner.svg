<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="el-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060813" />
    </linearGradient>
    <radialGradient id="el-glow" cx="60%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.38" />
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#el-bg)" rx="20" />
  <rect width="640" height="360" fill="url(#el-glow)" rx="20" />

  <!-- Subtle grid lines -->
  <g opacity="0.08" stroke="#cbd5e1" stroke-width="1">
    <line x1="0" y1="90" x2="640" y2="90" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="270" x2="640" y2="270" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
  </g>

  <!-- Soundwave Visualizer on Right Side -->
  <g transform="translate(370, 70)" filter="url(#glow-blur)">
    <!-- Audio Waveform Bars -->
    <rect x="0" y="70" width="7" height="60" rx="3.5" fill="url(#wave-grad)" opacity="0.4" />
    <rect x="14" y="50" width="7" height="100" rx="3.5" fill="url(#wave-grad)" opacity="0.6" />
    <rect x="28" y="30" width="7" height="140" rx="3.5" fill="url(#wave-grad)" opacity="0.8" />
    <rect x="42" y="15" width="7" height="170" rx="3.5" fill="url(#wave-grad)" opacity="0.9" />
    <rect x="56" y="40" width="7" height="120" rx="3.5" fill="url(#wave-grad)" opacity="0.75" />
    <rect x="70" y="20" width="7" height="160" rx="3.5" fill="url(#wave-grad)" opacity="0.95" />
    <rect x="84" y="0" width="7" height="200" rx="3.5" fill="url(#wave-grad)" opacity="1.0" />
    <rect x="98" y="25" width="7" height="150" rx="3.5" fill="url(#wave-grad)" opacity="0.9" />
    <rect x="112" y="10" width="7" height="180" rx="3.5" fill="url(#wave-grad)" opacity="0.95" />
    <rect x="126" y="45" width="7" height="110" rx="3.5" fill="url(#wave-grad)" opacity="0.7" />
    <rect x="140" y="20" width="7" height="160" rx="3.5" fill="url(#wave-grad)" opacity="0.85" />
    <rect x="154" y="35" width="7" height="130" rx="3.5" fill="url(#wave-grad)" opacity="0.8" />
    <rect x="168" y="55" width="7" height="90" rx="3.5" fill="url(#wave-grad)" opacity="0.6" />
    <rect x="182" y="75" width="7" height="50" rx="3.5" fill="url(#wave-grad)" opacity="0.45" />
    <rect x="196" y="85" width="7" height="30" rx="3.5" fill="url(#wave-grad)" opacity="0.3" />
  </g>

  <!-- Left Content: Brand & Identity -->
  <g transform="translate(48, 56)">
    <!-- ElevenLabs Logo Icon (Double Vertical Bars) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="8" height="36" rx="4" fill="#ffffff" />
      <rect x="15" y="0" width="8" height="36" rx="4" fill="#ffffff" />
      <!-- Brand Name -->
      <text x="36" y="27" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="-0.5">ElevenLabs</text>
    </g>

    <!-- Category Pill -->
    <g transform="translate(0, 58)">
      <rect x="0" y="0" width="168" height="26" rx="13" fill="rgba(99,102,241,0.2)" stroke="rgba(129,140,248,0.4)" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#38bdf8" />
      <text x="26" y="17" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#c7d2fe" letter-spacing="0.5">FRONTIER VOICE AI</text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="128" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="-0.3">
      Conversational AI &amp;
    </text>
    <text x="0" y="156" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#a5b4fc" letter-spacing="-0.3">
      Ultra-Realistic Speech
    </text>

    <!-- Subtitle / Value prop -->
    <text x="0" y="194" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
      Voice cloning, 29+ languages &amp; streaming API
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 222)">
      <text x="0" y="0" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">✦ Low-Latency Streaming</text>
      <text x="145" y="0" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">✦ Free 10k Credits/mo</text>
    </g>
  </g>

  <!-- Corner Official Partner Badge -->
  <g transform="translate(488, 28)">
    <rect x="0" y="0" width="124" height="24" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="1" />
    <text x="62" y="16" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">OFFICIAL PARTNER</text>
  </g>

  <!-- Border Highlight -->
  <rect x="1" y="1" width="638" height="358" rx="19" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
</svg>
