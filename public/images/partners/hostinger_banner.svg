<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="host-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e38" />
      <stop offset="50%" stop-color="#241352" />
      <stop offset="100%" stop-color="#0e0722" />
    </linearGradient>
    <radialGradient id="host-glow" cx="65%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#673de6" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#180e38" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="server-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b207a" />
      <stop offset="100%" stop-color="#1b0e3f" />
    </linearGradient>
    <linearGradient id="neon-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#host-bg)" rx="20" />
  <rect width="640" height="360" fill="url(#host-glow)" rx="20" />

  <!-- Grid lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="640" y2="90" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="270" x2="640" y2="270" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
  </g>

  <!-- Server Rack Illustration on Right -->
  <g transform="translate(400, 75)">
    <!-- Server Unit 1 -->
    <rect x="0" y="0" width="190" height="48" rx="8" fill="url(#server-grad)" stroke="#673de6" stroke-width="1.5" />
    <circle cx="20" cy="24" r="4" fill="#10b981" />
    <circle cx="32" cy="24" r="4" fill="#38bdf8" />
    <line x1="50" y1="24" x2="140" y2="24" stroke="#673de6" stroke-width="3" stroke-linecap="round" />
    <rect x="155" y="18" width="20" height="12" rx="2" fill="#673de6" opacity="0.5" />

    <!-- Server Unit 2 (NVMe Storage) -->
    <rect x="0" y="60" width="190" height="48" rx="8" fill="url(#server-grad)" stroke="#8b5cf6" stroke-width="1.5" />
    <circle cx="20" cy="84" r="4" fill="#10b981" />
    <circle cx="32" cy="84" r="4" fill="#10b981" />
    <line x1="50" y1="84" x2="110" y2="84" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <text x="145" y="88" font-family="monospace" font-size="10" font-weight="700" fill="#34d399">NVMe</text>

    <!-- Server Unit 3 (AI Agent Cluster) -->
    <rect x="0" y="120" width="190" height="48" rx="8" fill="url(#server-grad)" stroke="#673de6" stroke-width="1.5" />
    <circle cx="20" cy="144" r="4" fill="#a855f7" />
    <circle cx="32" cy="144" r="4" fill="#38bdf8" />
    <line x1="50" y1="144" x2="130" y2="144" stroke="#a855f7" stroke-width="3" stroke-linecap="round" />
    <text x="145" y="148" font-family="monospace" font-size="10" font-weight="700" fill="#c084fc">n8n</text>

    <!-- Glowing Speed Indicator -->
    <g transform="translate(0, 182)">
      <text x="95" y="18" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399">⚡ 300 MB/s NVMe Read/Write</text>
    </g>
  </g>

  <!-- Left Content -->
  <g transform="translate(48, 56)">
    <!-- Logo & Name -->
    <g transform="translate(0, 0)">
      <path d="M0,8 L16,0 L32,8 L32,28 L16,36 L0,28 Z" fill="#673de6" />
      <path d="M12,12 L20,12 L20,24 L12,24 Z" fill="#ffffff" />
      <text x="44" y="27" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff">Hostinger</text>
    </g>

    <!-- Pill -->
    <g transform="translate(0, 58)">
      <rect x="0" y="0" width="160" height="26" rx="13" fill="rgba(16,185,129,0.18)" stroke="rgba(16,185,129,0.4)" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#10b981" />
      <text x="26" y="17" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" letter-spacing="0.5">HIGH-SPEED VPS</text>
    </g>

    <text x="0" y="128" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="-0.3">
      Deploy AI Agents &amp;
    </text>
    <text x="0" y="156" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#c084fc" letter-spacing="-0.3">
      Self-Host n8n in 1-Click
    </text>

    <text x="0" y="194" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
      Ultra-fast NVMe storage, dedicated IPv4 &amp; full root access
    </text>

    <g transform="translate(0, 222)">
      <text x="0" y="0" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#34d399">✦ 1-Click Docker &amp; Templates</text>
      <text x="165" y="0" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#34d399">✦ 30-Day Money Back</text>
    </g>
  </g>

  <!-- Top Right Badge -->
  <g transform="translate(492, 28)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="1" />
    <text x="60" y="16" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">DEV DISCOUNT</text>
  </g>

  <rect x="1" y="1" width="638" height="358" rx="19" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
</svg>
