<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#060913" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <title>AI News Radar - Mobile Web App | Real-Time Intel, Social Signals & Videos</title>
  <meta name="description" content="Mobile-first panoramic AI intelligence radar focusing on breaking news, 70+ verified tech leader tweets, and hands-on developer videos.">
  <link rel="canonical" href="https://ainewsradar.xyz/m">
  <link rel="alternate" hreflang="en" href="https://ainewsradar.xyz/m">
  <link rel="alternate" hreflang="zh-CN" href="https://ainewsradar.xyz/zh/m">
  <link rel="alternate" hreflang="x-default" href="https://ainewsradar.xyz/m">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
  <link rel="stylesheet" href="/css/style.min.css">
  <link rel="stylesheet" href="/m/css/mobile.css">
  <link rel="preload" href="/data/latest_news.json" as="fetch" crossorigin>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">

  <!-- Mobile App Header (Fixed Top) -->
  <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border-b border-slate-200/80 dark:border-slate-800 pt-safe">
    <div class="px-2.5 sm:px-3.5 h-14 flex items-center justify-between gap-1.5 min-w-0">
      <!-- Brand Logo (Protected from translation, strictly single-line) -->
      <a href="/m" class="flex items-center gap-1.5 sm:gap-2 touch-card shrink-0 notranslate" title="AI News Radar">
        <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-rose-500 flex items-center justify-center text-white text-xs font-black shadow-sm shrink-0">
          ⚡
        </div>
        <div class="flex items-center gap-1 whitespace-nowrap notranslate">
          <span class="font-extrabold text-[13.5px] sm:text-[15px] tracking-tight bg-gradient-to-r from-slate-900 via-indigo-900 to-slate-900 dark:from-white dark:via-indigo-200 dark:to-white bg-clip-text text-transparent">
            AI News Radar
          </span>
          <span class="px-1.5 py-0.5 rounded-full bg-indigo-50 dark:bg-indigo-950/80 text-indigo-600 dark:text-indigo-400 font-bold text-[8.5px] border border-indigo-200/40 dark:border-indigo-800/40">
            M
          </span>
        </div>
      </a>

      <!-- Header Actions (Compact, responsive, zero-wrap) -->
      <div class="flex items-center gap-1 sm:gap-1.5 shrink-0 notranslate">
        <!-- Live Status Badge -->
        <div class="flex items-center gap-1 px-1.5 sm:px-2 py-0.5 rounded-full bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200/50 dark:border-emerald-800/50 text-[9.5px] font-bold text-emerald-600 dark:text-emerald-400 font-mono notranslate">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 live-pulse"></span>
          <span class="hidden xs:inline">LIVE</span>
        </div>

        <!-- Language Picker Button -->
        <button 
          type="button"
          id="btn-lang-picker"
          onclick="window.MobileApp.openLangPicker()" 
          title="Switch Language Edition"
          class="h-7 px-1.5 sm:px-2 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200/60 dark:border-slate-700/60 text-slate-700 dark:text-slate-300 text-xs font-bold flex items-center gap-1 active:scale-90 transition-transform cursor-pointer notranslate"
        >
          <span id="lang-btn-flag">🇬🇧</span>
          <span id="lang-btn-text">EN</span>
        </button>

        <!-- Theme Toggle -->
        <button 
          type="button"
          onclick="window.MobileApp.toggleTheme()" 
          title="Toggle Day/Night Mode"
          class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200/60 dark:border-slate-700/60 text-xs flex items-center justify-center active:scale-90 transition-transform cursor-pointer"
        >
          <span id="theme-icon">🌙</span>
        </button>

        <!-- Search Toggle -->
        <button 
          type="button"
          onclick="window.MobileApp.toggleSearchBox()" 
          title="Search Feed"
          class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200/60 dark:border-slate-700/60 text-slate-700 dark:text-slate-300 text-xs flex items-center justify-center active:scale-90 transition-transform cursor-pointer"
        >
          🔍
        </button>

        <!-- Refresh Button -->
        <button 
          type="button"
          onclick="window.MobileApp.refresh()" 
          title="Refresh Data"
          class="w-7 h-7 rounded-lg bg-indigo-50 dark:bg-indigo-950/80 border border-indigo-200/60 dark:border-indigo-800/60 text-indigo-600 dark:text-indigo-400 text-xs flex items-center justify-center active:scale-90 transition-transform cursor-pointer"
        >
          <span id="refresh-btn-icon" class="inline-block transition-transform">🔄</span>
        </button>
      </div>
    </div>

    <!-- Collapsible Search Bar -->
    <div id="mobile-search-box" class="hidden px-3.5 pb-2.5 pt-1 border-t border-slate-100 dark:border-slate-800/80">
      <div class="relative">
        <input 
          id="mobile-search-input"
          type="search" 
          placeholder="Search news, leader tweets & videos..." 
          oninput="window.MobileApp.handleSearch(event)"
          class="w-full pl-8 pr-8 py-2 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        >
        <span class="absolute left-2.5 top-2.5 text-xs text-slate-400">🔍</span>
        <button 
          type="button"
          onclick="window.MobileApp.clearSearch()" 
          id="mobile-search-clear" 
          class="hidden absolute right-2.5 top-2.5 text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
        >
          ✕
        </button>
      </div>
    </div>

    <!-- Channel Segment Bar (Sticky Navigation Tabs) -->
    <nav class="flex border-t border-slate-200/80 dark:border-slate-800 bg-white/95 dark:bg-slate-900/95">
      <button 
        type="button"
        data-tab-target="news"
        onclick="window.MobileApp.switchTab('news')" 
        class="flex-1 py-2.5 text-center text-xs font-bold text-indigo-600 dark:text-indigo-400 border-b-2 border-indigo-600 dark:border-indigo-400 transition-all cursor-pointer"
      >
        📰 Intel & News
      </button>
      <button 
        type="button"
        data-tab-target="social"
        onclick="window.MobileApp.switchTab('social')" 
        class="flex-1 py-2.5 text-center text-xs font-medium text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all cursor-pointer"
      >
        💬 Social Radar
      </button>
      <button 
        type="button"
        data-tab-target="videos"
        onclick="window.MobileApp.switchTab('videos')" 
        class="flex-1 py-2.5 text-center text-xs font-medium text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all cursor-pointer"
      >
        🎬 Videos
      </button>
      <button 
        type="button"
        data-tab-target="top"
        onclick="window.MobileApp.switchTab('top')" 
        class="flex-1 py-2.5 text-center text-xs font-medium text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all cursor-pointer"
      >
        🔥 Top 3 Digest
      </button>
    </nav>

    <!-- Dynamic Sub-Filter Pills Bar (Nested inside sticky header to prevent layout shift) -->
    <div id="sub-filter-bar" class="border-t border-slate-100 dark:border-slate-800/80 bg-slate-50/95 dark:bg-slate-950/95">
      <!-- Populated by JS -->
    </div>
  </header>

  <!-- Visitor Language Suggestion Mini Banner -->
  <div id="mobile-lang-suggest-banner" class="hidden"></div>

  <!-- Main Feed Stream Container -->
  <main id="mobile-feed" class="py-2 min-h-screen">
    <!-- Populated by JS -->
  </main>

  <!-- Mobile Footer -->
  <footer class="mt-8 px-4 py-8 border-t border-slate-200/80 dark:border-slate-800 text-center space-y-3 pb-[calc(80px+var(--sab))]">
    <button 
      type="button"
      onclick="window.MobileApp.switchToDesktop()" 
      class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-bold touch-card shadow-xs cursor-pointer"
    >
      <span>💻 Switch to Desktop Version</span>
    </button>
    <p class="text-[11px] text-slate-400">
      AI News Radar · Mobile Web App · Real-time Intel, Social & Videos
    </p>
    <div class="flex items-center justify-center gap-3 text-[11px] text-slate-400">
      <a href="/about" class="hover:underline">About</a>
      <span>·</span>
      <a href="/editorial-policy" class="hover:underline">Editorial Policy</a>
      <span>·</span>
      <a href="/privacy" class="hover:underline">Privacy</a>
      <span>·</span>
      <a href="/terms" class="hover:underline">Terms</a>
    </div>
  </footer>

  <!-- Floating Back to Top Button -->
  <button 
    type="button"
    id="btn-back-to-top" 
    aria-label="Back to top" 
    class="fixed bottom-20 right-3.5 z-30 w-10 h-10 rounded-full bg-indigo-600/95 text-white shadow-lg backdrop-blur-md flex items-center justify-center font-bold text-sm opacity-0 pointer-events-none transition-all duration-300 transform translate-y-3 cursor-pointer"
  >
    ↑
  </button>

  <!-- Bottom Navigation Dock (Native App Style) -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border-t border-slate-200/80 dark:border-slate-800 flex items-center justify-around h-16 pb-[env(safe-area-inset-bottom)]">
    <button 
      type="button"
      data-dock-target="news"
      onclick="window.MobileApp.switchTab('news')" 
      class="flex flex-col items-center justify-center flex-1 h-full text-indigo-600 dark:text-indigo-400 touch-card cursor-pointer"
    >
      <span class="text-lg">📰</span>
      <span class="text-[10px] font-bold mt-0.5">News</span>
      <span class="dock-active-dot w-1 h-1 rounded-full bg-indigo-600 dark:bg-indigo-400 mt-0.5 opacity-100 transition-opacity"></span>
    </button>
    <button 
      type="button"
      data-dock-target="social"
      onclick="window.MobileApp.switchTab('social')" 
      class="flex flex-col items-center justify-center flex-1 h-full text-slate-400 touch-card cursor-pointer"
    >
      <span class="text-lg">💬</span>
      <span class="text-[10px] font-bold mt-0.5">Social</span>
      <span class="dock-active-dot w-1 h-1 rounded-full bg-indigo-600 dark:bg-indigo-400 mt-0.5 opacity-0 transition-opacity"></span>
    </button>
    <button 
      type="button"
      data-dock-target="videos"
      onclick="window.MobileApp.switchTab('videos')" 
      class="flex flex-col items-center justify-center flex-1 h-full text-slate-400 touch-card cursor-pointer"
    >
      <span class="text-lg">🎬</span>
      <span class="text-[10px] font-bold mt-0.5">Videos</span>
      <span class="dock-active-dot w-1 h-1 rounded-full bg-indigo-600 dark:bg-indigo-400 mt-0.5 opacity-0 transition-opacity"></span>
    </button>
    <button 
      type="button"
      data-dock-target="top"
      onclick="window.MobileApp.switchTab('top')" 
      class="flex flex-col items-center justify-center flex-1 h-full text-slate-400 touch-card cursor-pointer"
    >
      <span class="text-lg">🌟</span>
      <span class="text-[10px] font-bold mt-0.5">Top 3</span>
      <span class="dock-active-dot w-1 h-1 rounded-full bg-indigo-600 dark:bg-indigo-400 mt-0.5 opacity-0 transition-opacity"></span>
    </button>
  </nav>

  <!-- Mobile Reader Bottom Sheet Modal -->
  <div id="article-modal-overlay" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center animate-fade-in">
    <div 
      id="article-modal-content" 
      class="w-full sm:max-w-lg bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-2xl max-h-[90vh] overflow-hidden shadow-2xl animate-slide-up border-t border-slate-200/60 dark:border-slate-800"
    >
      <!-- Populated by JS -->
    </div>
  </div>

  <!-- Mobile Language Picker Action Sheet Modal (Full 31 Languages) -->
  <div id="lang-picker-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center animate-fade-in notranslate">
    <div class="w-full sm:max-w-md bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-2xl p-4 sm:p-5 shadow-2xl animate-slide-up border-t border-slate-200/80 dark:border-slate-800 flex flex-col max-h-[82vh]">
      <div class="pt-1 pb-2 flex justify-center cursor-pointer" onclick="window.MobileApp.closeLangPicker()">
        <div class="w-10 h-1 bg-slate-300 dark:bg-slate-700 rounded-full"></div>
      </div>
      <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-100 dark:border-slate-800">
        <div class="flex items-center gap-2">
          <span class="text-xl">🌐</span>
          <h3 class="font-extrabold text-base text-slate-900 dark:text-slate-100">Select Language (31 Languages)</h3>
        </div>
        <button 
          type="button" 
          onclick="window.MobileApp.closeLangPicker()" 
          class="w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 flex items-center justify-center font-bold text-sm cursor-pointer"
        >
          ✕
        </button>
      </div>
      <div class="relative mb-2.5">
        <input 
          id="lang-picker-search" 
          type="search" 
          placeholder="Search 31 languages..." 
          oninput="window.MobileApp.filterLanguageList(event)" 
          class="w-full pl-8 pr-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        >
        <span class="absolute left-2.5 top-2 text-xs text-slate-400">🔍</span>
      </div>
      <div id="lang-picker-list" class="flex-1 mobile-scroll-list space-y-2 pr-1"></div>
      <div class="pt-2 text-center border-t border-slate-100 dark:border-slate-800">
        <span class="text-[10px] text-slate-400 font-medium tracking-tight">↕ Scroll or drag up/down to explore all 31 languages</span>
      </div>
    </div>
  </div>

  <script>
    window.__IS_ZH = false;
  </script>
  <script src="/m/js/mobile.js"></script>
  <!-- Microsoft Clarity (Deferred) -->
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "zasso3bkvl");
  </script>
</body>
</html>
